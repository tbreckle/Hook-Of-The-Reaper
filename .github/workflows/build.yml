name: Build

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} - Qt${{ matrix.qt-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            qt-version: "5.15.2"
            qt-arch: "win64_msvc2019_64"
            cmake-args: "-DUSE_QT6=OFF"
            artifact-name: "HookOfTheReaper-Windows-Qt5-legacy"

          - os: windows-latest
            qt-version: "6.5.3"
            qt-arch: "win64_msvc2022_64"
            cmake-args: "-DUSE_QT6=ON"
            artifact-name: "HookOfTheReaper-Windows-Qt6-modern"

          # Ubuntu 22.04 builds
          - os: ubuntu-22.04
            qt-version: "5.15.2"
            qt-arch: "gcc_64"
            cmake-args: "-DUSE_QT6=OFF"
            artifact-name: "HookOfTheReaper-Ubuntu22.04-Qt5"

          - os: ubuntu-22.04
            qt-version: "6.2.4"
            qt-arch: "gcc_64"
            cmake-args: "-DUSE_QT6=ON"
            artifact-name: "HookOfTheReaper-Ubuntu22.04-Qt6"

          # Ubuntu 24.04 builds
          - os: ubuntu-24.04
            qt-version: "5.15.13"
            qt-arch: "gcc_64"
            cmake-args: "-DUSE_QT6=OFF"
            artifact-name: "HookOfTheReaper-Ubuntu24.04-Qt5"

          - os: ubuntu-24.04
            qt-version: "6.4.2"
            qt-arch: "gcc_64"
            cmake-args: "-DUSE_QT6=ON"
            artifact-name: "HookOfTheReaper-Ubuntu24.04-Qt6"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt-version }}
          arch: ${{ matrix.qt-arch }}
          cache: true
          modules: "qtserialport qtmultimedia qtconnectivity"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libhidapi-dev \
            libudev-dev

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Create deployment directory (Windows Qt6)
        if: runner.os == 'Windows' && contains(matrix.cmake-args, 'USE_QT6=ON')
        shell: bash
        run: |
          mkdir -p deploy
          cp build/HookOfTheReaper.exe deploy/
          cd build
          cmake --install . --prefix ../deploy --config Release

      - name: Create deployment directory (Windows Qt5)
        if: runner.os == 'Windows' && contains(matrix.cmake-args, 'USE_QT6=OFF')
        shell: bash
        run: |
          mkdir -p deploy
          cp build/HookOfTheReaper.exe deploy/
          # Copy Qt5 dependencies manually
          windeployqt deploy/HookOfTheReaper.exe

      - name: Create deployment directory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p deploy
          cp build/HookOfTheReaper deploy/
          # Create a simple wrapper script
          echo '#!/bin/bash' > deploy/run.sh
          echo 'DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' >> deploy/run.sh
          echo 'export LD_LIBRARY_PATH="${DIR}:${LD_LIBRARY_PATH}"' >> deploy/run.sh
          echo 'exec "${DIR}/HookOfTheReaper" "$@"' >> deploy/run.sh
          chmod +x deploy/run.sh

      - name: Copy data files
        shell: bash
        run: |
          cp -r data deploy/ || true
          cp -r ini deploy/ || true
          cp -r defaultLG deploy/ || true
          cp README.md deploy/ || true
          cp LICENSE deploy/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: deploy/
          retention-days: 30

      - name: Create release archive (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd deploy
          7z a ../${{ matrix.artifact-name }}.zip *

      - name: Create release archive (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd deploy
          tar -czf ../${{ matrix.artifact-name }}.tar.gz *

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.artifact-name }}.zip
            ${{ matrix.artifact-name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
